<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{heading}}</title>
    <style>
      body { margin: 0; background: #fcfbf8; color: #333333; font-family: Arial, sans-serif; }
      .shell { width: 100%; padding: 32px 12px; }
      .card { width: 100%; max-width: 600px; margin: 0 auto; overflow: hidden; background: #ffffff; border: 1px solid #edf1f3; border-radius: 18px; }
      .header { padding: 26px 32px; background: #eaf4f8; }
      .logo { width: 112px; height: auto; }
      .content { padding: 32px; }
      h1 { margin: 0 0 12px; color: #1a1a2e; font-size: 25px; line-height: 1.3; }
      p { margin: 0 0 20px; color: #666666; font-size: 15px; line-height: 1.7; }
      .details { width: 100%; margin: 24px 0; border-collapse: collapse; border: 1px solid #e8eef1; border-radius: 12px; }
      .details td { padding: 13px 15px; border-bottom: 1px solid #edf1f3; font-size: 14px; vertical-align: top; }
      .details tr:last-child td { border-bottom: 0; }
      .details .label { width: 35%; color: #6aa4c3; font-weight: 700; }
      .button { display: inline-block; padding: 12px 22px; color: #ffffff !important; background: #6aa4c3; border-radius: 9px; font-size: 14px; font-weight: 700; text-decoration: none; }
      .footer { padding: 20px 32px; color: #888888; background: #fafafa; font-size: 12px; line-height: 1.6; text-align: center; }
      @media only screen and (max-width: 520px) {
        .header, .content { padding: 24px 20px; }
        .details .label { width: 40%; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <div class="header"><img class="logo" src="{{logoUrl}}" alt="Junior Pass" /></div>
        <div class="content">
          <h1>{{heading}}</h1>
          <p>Hi {{parentName}},</p>
          <p>{{intro}}</p>
          <table class="details" role="presentation">
            <tr><td class="label">Class</td><td>{{classTitle}}</td></tr>
            <tr><td class="label">Child</td><td>{{childNames}}</td></tr>
            {{previousDateRow}}
            <tr><td class="label">{{dateLabel}}</td><td>{{dateValue}}</td></tr>
            {{reasonRow}}
          </table>
          <a class="button" href="{{manageBookingsUrl}}">View my bookings</a>
        </div>
        <div class="footer">This message was sent by Junior Pass about your booking.<br />© {{currentYear}} Junior Pass</div>
      </div>
    </div>
  </body>
</html>
